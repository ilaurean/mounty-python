name: Destroy Azure Resources

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to destroy
        required: true
        type: choice
        options:
          - dev
          - prod
      confirm:
        type: string
        description: 'Type the environment name again to confirm (e.g. "dev")'
        required: true

permissions:
  contents: write  # needed to delete the cached state after destroy
  id-token: write  # required for OIDC federated credential login

env:
  DOTNET_VERSION: "10.0.x"
  AZURE_LOCATION: "northeurope"

jobs:
  destroy:
    name: Destroy (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      id-token: write   # required for OIDC federated credential login
      contents: write   # required to clear deployment state cache

    steps:
      - name: Confirm environment matches input
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]; then
            echo "::error::Confirmation input '${{ github.event.inputs.confirm }}' does not match environment '${{ github.event.inputs.environment }}'. Aborting."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore workloads
        run: dotnet workload restore MountyPython.AppHost/MountyPython.AppHost.csproj

      - name: Install aspire CLI
        run: dotnet tool install --global Aspire.Cli

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restore aspire deployment state
        uses: actions/cache/restore@v4
        with:
          path: ~/.aspire/deployments
          key:          aspire-state-${{ github.event.inputs.environment }}-
          restore-keys: aspire-state-${{ github.event.inputs.environment }}-

      - name: aspire destroy
        env:
          Azure__CredentialSource: AzureCli
          Azure__SubscriptionId: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          Azure__Location:       ${{ env.AZURE_LOCATION }}
          Azure__ResourceGroup:  rg-mountypython-${{ github.event.inputs.environment }}
          DOTNET_ENVIRONMENT:    ${{ github.event.inputs.environment == 'prod' && 'Production' || 'Development' }}
        run: |
          aspire destroy \
            --apphost MountyPython.AppHost/MountyPython.AppHost.csproj \
            --non-interactive \
            --yes
            
      - name: Purge soft-deleted Key Vaults
        # After destroy, Azure soft-deletes KVs for 90 days.
        # Purge them immediately so a subsequent deploy can provision a fresh KV
        # with the same name without hitting recovery/conflict errors.
        continue-on-error: true
        run: |
          for kv in $(az keyvault list-deleted --query "[?starts_with(name,'postgres')].name" -o tsv 2>/dev/null); do
            echo "Purging soft-deleted Key Vault: $kv"
            az keyvault purge --name "$kv" --location "${{ env.AZURE_LOCATION }}" || true
          done

      - name: Clear deployment state cache after destroy
        # The resources are gone — wipe the cached state so the next deploy
        # starts clean without stale resource IDs.
        run: |
          rm -rf ~/.aspire/deployments
          echo "Deployment state cleared."
