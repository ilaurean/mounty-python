<mat-toolbar color="primary">
  <img src="logo.svg" alt="Mounty Python" class="logo" />
  <span class="title">Mounty Python</span>
  <a mat-button routerLink="/operations" routerLinkActive="active">
    <mat-icon>receipt_long</mat-icon> Orders
  </a>
  <a mat-button routerLink="/inventory" routerLinkActive="active">
    <mat-icon>memory</mat-icon> Boards
  </a>
  <span class="spacer"></span>
  <mat-icon aria-hidden="true">account_circle</mat-icon>
  <span class="user">{{ auth.username }}</span>
  <button mat-icon-button (click)="logout()" aria-label="Logout" title="Logout">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
<main>
  <router-outlet />
</main>
